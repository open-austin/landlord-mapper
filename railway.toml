# Railway service configuration.
#
# Dockerfile rather than a Nixpacks autodetect build: the app is stdlib-only, so
# Nixpacks would infer a Python project, look for requirements.txt, find none,
# and we would be relying on its guess. An explicit Dockerfile also pins the
# interpreter to the version the output-identity harness was run against.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# NO healthcheckPath on purpose, and this is the one setting worth explaining.
#
# /health is a good healthcheck -- 200 in ~1.4 ms, and it touches the database so
# it genuinely fails when the volume is unreadable. But it cannot be enabled on
# the FIRST deploy: the volume starts empty, entrypoint.sh sits in its wait loop
# until the database is streamed in, and a healthcheck would fail the deployment
# before there is a running container to `railway ssh` into. That is the same
# deadlock the wait loop exists to break, reintroduced one layer up.
#
# Once the volume is seeded and the service is serving, add:
#     healthcheckPath = "/health"
#     healthcheckTimeout = 30
# From then on the volume is persistent, so restarts find the database in place
# and the healthcheck is only ever reporting real failures.

# The server holds no request state between requests and the database is opened
# read-only, so a restart is always safe. ON_FAILURE rather than ALWAYS so a
# genuine crash-loop surfaces as a failed deploy instead of restarting forever.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# One replica. Scaling out would mean N copies of the page cache against one
# volume, and the measured bottleneck is page cache, not CPU.
numReplicas = 1
