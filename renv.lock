      "NeedsCompilation": "no",
      "Author": "Henrik Bengtsson [aut, cre, cph] (ORCID: <https://orcid.org/0000-0002-7579-5165>)",
      "Maintainer": "Henrik Bengtsson <henrikb@braju.com>",
      "Repository": "CRAN"
    },
